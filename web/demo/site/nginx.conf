# nginx for the showcase. It runs on a read-only root filesystem: the pid file and every
# temporary path are under /tmp or /var/run, which the platform mounts as tmpfs.
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include            /etc/nginx/mime.types;
    default_type       application/octet-stream;
    # .qvp, .qvl, .qva and .qvo have no entry in mime.types: they are bytes for the engine.
    types { application/wasm wasm; }

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # A page file and a letter layer are geometry, and they compress to about half.
    gzip               on;
    gzip_min_length    1024;
    gzip_types         text/css application/javascript application/json application/wasm application/octet-stream;

    access_log         /dev/stdout;

    server {
        listen       8080 default_server;
        root         /usr/share/nginx/html;
        index        index.html;

        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The page and its scripts keep their names from one build to the next, and the page
        # names its scripts by the digest of the build. So nothing here is cached without a
        # check: a browser never runs an older script against a newer page.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }

        # The ornament set keeps its name when its content changes.
        location = /pages/ornaments.qvo {
            add_header Cache-Control "no-cache";
        }

        # The pages, the letter layers and the fonts change only with a new build of the data.
        location ~ ^/(pages|letters|fonts)/ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        location ~ /\. { deny all; }
    }
}
