name: qvp_flutter
description: "Flutter wrapper for the QVP vector mushaf engine (dart:ffi over libqvp_ffi)."
version: 0.2.2
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
