// @quran.ws/qvp-react-native — Android module. Thin: marshalling + handle reconciliation over the Kotlin
// library `ws.quran.qvp` (packages/android/qvp), which is JNI over crates/qvp-ffi/include/qvp.h.
//
// The module links the Kotlin library in one of three ways. The first that applies wins:
//   1. The app's settings.gradle includes the library as the Gradle project `:qvp`:
//        include(":qvp"); project(":qvp").projectDir = file("<repo>/packages/android/qvp")
//      The module then depends on `project(":qvp")`. The example in this repository does this.
//   2. The Gradle property `qvpAndroidDir` names a checkout of packages/android/qvp. The module
//      compiles the library's Kotlin and JNI sources from that folder.
//   3. Otherwise the module depends on `ws.quran:qvp-android` from Maven Central. This is the
//      way for an app that installs the package from npm. The version is the version in this
//      package's package.json, so the two stay in step. The Gradle property `qvpVersion` sets
//      a different version.
buildscript {
    if (project == rootProject) {
        repositories { google(); mavenCentral() }
        dependencies {
            classpath("com.android.tools.build:gradle:8.7.3")
            classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet(prop, fallback) { rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }
def qvpProject = findProject(":qvp")
def qvpAndroidDir = rootProject.findProperty("qvpAndroidDir")
def qvpDir = qvpProject == null && qvpAndroidDir != null ? file(qvpAndroidDir) : null
def qvpVersion = rootProject.findProperty("qvpVersion") ?:
    new groovy.json.JsonSlurper().parse(file("$projectDir/../package.json")).version

android {
    namespace "ws.quran.qvp.rn"
    compileSdk safeExtGet("compileSdkVersion", 35)
    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        if (qvpDir != null) {
            externalNativeBuild { cmake { arguments "-DANDROID_STL=none" } }
            ndk { abiFilters "arm64-v8a", "x86_64", "armeabi-v7a" }
        }
    }
    if (qvpDir != null) {
        ndkVersion safeExtGet("ndkVersion", "27.2.12479018")
        externalNativeBuild { cmake { path file("$qvpDir/src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
        sourceSets { main { kotlin.srcDirs += "$qvpDir/src/main/kotlin"; java.srcDirs += "$qvpDir/src/main/kotlin" } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig false }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

repositories { google(); mavenCentral() }

dependencies {
    // version pinned by the React Native Gradle Plugin of the consuming app
    implementation "com.facebook.react:react-android"
    if (qvpProject != null) implementation project(":qvp")
    else if (qvpDir == null) implementation "ws.quran:qvp-android:$qvpVersion"
    testImplementation "junit:junit:4.13.2"
}
