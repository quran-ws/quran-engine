# The React Native package: install, typecheck, and build the TypeScript output, then
# compile the Android module's Kotlin, run its JVM unit tests, and resolve the Kotlin
# library from Maven Central as an app outside this repository does.
name: React Native

on:
  pull_request:
    paths:
      - ".github/workflows/react-native.yml"
      - ".github/actions/android-toolchain/**"
      - "scripts/build-engine-android.sh"
      - "packages/react-native/**"
      # The Android module compiles against the Kotlin library, so a change to the library's
      # sources or its build file can break the module.
      - "packages/android/qvp/build.gradle.kts"
      - "packages/android/qvp/src/main/kotlin/**"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/react-native/qvp-react-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      # The Kotlin library declares a CMake build and an NDK version, so the Android Gradle
      # plugin reads the NDK when it configures the project, even though this job builds
      # nothing native. Install the tools here. Left to Gradle, the NDK download sits in the
      # middle of the build, where it once ran past the job's timeout.
      - uses: ./.github/actions/android-toolchain
        with:
          packages: platforms;android-35 platforms;android-36 build-tools;36.0.0
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Typecheck the example against the library it just built, for the same reason the
      # other wrappers build theirs: nothing else calls the public API as an app does.
      - name: Typecheck the example
        working-directory: packages/react-native/example
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit
      - name: Test the example
        working-directory: packages/react-native/example
        run: npm test -- --ci
      # Compile the Android module's Kotlin in release and debug, and run its JVM unit tests.
      # Gradle runs in the example's build, because that build includes the module and the
      # Kotlin library as projects. A Kotlin error in the module, or a change to the library's
      # API that the module calls, fails here. These tasks need no native libraries and no
      # page data. `assembleRelease` would need both: it links the static engine libraries at
      # packages/android/qvp/prebuilt/<abi>/libqvp_ffi.a, which scripts/build-engine-android.sh
      # writes and which this repository never holds.
      - name: Compile and test the Android module
        working-directory: packages/react-native/example/android
        run: >-
          ./gradlew --no-daemon
          :quran.ws_qvp-react-native:compileReleaseKotlin
          :quran.ws_qvp-react-native:testDebugUnitTest

      # An app that installs the package from npm has no `:qvp` project, so the module takes
      # ws.quran:qvp-android from Maven Central. -PqvpFromMaven leaves `:qvp` out of the
      # example's build to take that path. The step checks that Gradle resolves the artifact,
      # at the version in the package's package.json. It does not compile against it: between
      # releases, the module can call library API that the last published version lacks. When
      # Maven Central does not hold the package version yet, as in a release pull request, the
      # step checks the latest published version through -PqvpVersion.
      - name: Resolve the Kotlin library from Maven Central
        working-directory: packages/react-native/example/android
        run: |
          set -o pipefail
          maven=https://repo1.maven.org/maven2/ws/quran/qvp-android
          v="$(node -p "require('../../qvp-react-native/package.json').version")"
          override=""
          if ! curl -fsSI "$maven/$v/qvp-android-$v.pom" >/dev/null; then
            v="$(curl -fsS "$maven/maven-metadata.xml" | sed -n 's|.*<release>\(.*\)</release>.*|\1|p')"
            echo "::notice::qvp-android $v is the latest on Maven Central; the package version is not published yet"
            override="-PqvpVersion=$v"
          fi
          ./gradlew --no-daemon -PqvpFromMaven $override \
            :quran.ws_qvp-react-native:dependencies --configuration releaseCompileClasspath \
            | tee "$RUNNER_TEMP/deps.txt"
          grep -qF -- "--- ws.quran:qvp-android:$v" "$RUNNER_TEMP/deps.txt"
          if grep -E "qvp-android.*FAILED|project :qvp" "$RUNNER_TEMP/deps.txt"; then exit 1; fi
