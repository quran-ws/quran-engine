# Once a night: the identity gate and the letter-layer gate over all 604 pages, and the
# benchmark numbers as an artifact for comparison with docs/MEASURED.md.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  identity-all-pages:
    name: identity gate, all 604 pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: |
            dist/pages
            pages
            pages-letters
            index
          key: test-data-letters-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ vars.QVP_SVG_TAG || 'v2.0.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      - name: Fetch test data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SVG_TAG: ${{ vars.QVP_SVG_TAG || 'v2.0.0' }}
          QVP_SYNC: letters
        run: scripts/sync-test-data.sh
      - name: All pages
        id: identity
        run: QVP_REQUIRE_DATA=1 QVP_TEST_ALL=1 cargo test -p qvp-convert --release --test identity -- --nocapture
      # The letter gate also runs when the identity gate fails, but not when a step
      # before it failed.
      - name: Letter layer, all pages
        if: success() || (failure() && steps.identity.outcome == 'failure')
        run: QVP_REQUIRE_DATA=1 QVP_REQUIRE_LETTERS=1 QVP_TEST_ALL=1 cargo test -p qvp-convert --release --test letters -- --nocapture
      - name: Diff images of failing pages
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-diffs-${{ github.run_id }}
          path: |
            target/identity/
            target/letters/

  bench:
    name: benchmark, page 042
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SVG_TAG: ${{ vars.QVP_SVG_TAG || 'v2.0.0' }}
        run: scripts/sync-test-data.sh
      - name: Run
        run: cargo run -p qvp-core --profile dist --example bench -- dist/pages/042.qvp | tee bench.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: bench.txt
