name: Android SDK

on:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packages/android/**"
      - "scripts/build-engine-android.sh"
      - "scripts/check-android-page-size.sh"
      - "scripts/package-android.sh"
      - "scripts/sync-android-test-data.sh"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "ndk;$NDK_VERSION" "cmake;3.22.1"
      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Unit tests
        working-directory: packages/android
        run: ./gradlew --no-daemon :qvp:testDebugUnitTest
      - name: Package AAR
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          scripts/package-android.sh "$version-${GITHUB_SHA::12}"
      - name: Inspect native payload
        run: unzip -l dist/android/*.aar | grep 'jni/.*/libqvp_jni.so'
      - uses: actions/upload-artifact@v7
        with:
          name: qvp-android-${{ github.sha }}
          path: |
            dist/android/*.aar
            dist/android/*.sha256

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "system-images;android-35;google_apis;x86_64" "ndk;$NDK_VERSION" "cmake;3.22.1"
      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build engine and fetch test page
        run: |
          scripts/build-engine-android.sh
          scripts/sync-android-test-data.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd packages/android && ./gradlew --no-daemon :qvp:connectedDebugAndroidTest
      - name: Report benchmark
        if: always()
        run: grep -h 'QvpBenchmark:' packages/android/qvp/build/outputs/androidTest-results/connected/debug/*/logcat-*Benchmark* || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qvp-android-device-${{ github.sha }}
          path: |
            packages/android/qvp/build/outputs/androidTest-results/
            packages/android/qvp/build/reports/androidTests/
