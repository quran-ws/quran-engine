# The Flutter package: analyze, run the dart:ffi tests against a host build of the
# engine and the page data release, and build the example for Android and web.
name: Flutter

on:
  pull_request:
    paths:
      - ".github/workflows/flutter.yml"
      - ".github/actions/android-toolchain/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packages/flutter/**"
      - "web/qvp.js"
      - "scripts/sync-flutter-web-engine.sh"
      - "scripts/build-engine-android.sh"
      - "scripts/sync-example-data.sh"
      - "scripts/sync-test-data.sh"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Cache page data
        uses: actions/cache@v4
        with:
          path: dist/pages
          key: test-data-pages-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      # Only the page data. The SVG bundle serves the identity gate, which runs in ci.yml.
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SYNC: pages
        run: scripts/sync-test-data.sh
      - name: Build the host engine library
        run: cargo build -p qvp-ffi --release
      # The web engine assets are not tracked. `flutter test` and the example build bundle
      # the asset directories, so a web test or build would fail without this step.
      - name: Build the web engine assets
        run: scripts/sync-flutter-web-engine.sh
      - name: Example assets (the analyzer checks the asset directory exists)
        run: scripts/sync-example-data.sh flutter
      # dart format is the house style for this package. It runs before the analyzer so a
      # formatting failure is not buried under analyzer output. The Dart that checks here is
      # the one the pinned Flutter brings, so a Flutter upgrade may ask for a reformat commit.
      # pub get comes first: the formatter takes the language version from the resolved
      # package config, and without one it formats for the newest language, which is not
      # what a contributor's `flutter pub get && dart format` does.
      - name: Format
        working-directory: packages/flutter/qvp_flutter
        run: flutter pub get && dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze
        working-directory: packages/flutter/qvp_flutter
        run: flutter pub get && flutter analyze
      # The example is a package of its own, so the analyzer only resolves its imports
      # after its own pub get. Without this step nothing checks the example's API use.
      - name: Analyze the example
        working-directory: packages/flutter/qvp_flutter/example
        run: flutter pub get && flutter analyze
      - name: Test
        working-directory: packages/flutter/qvp_flutter
        env:
          QVP_LIB: ${{ github.workspace }}/target/release/libqvp_ffi.so
        run: flutter test

  # The example is the only app that reads the plugin's manifests, icon catalogs and asset
  # declarations, and only a build reads them. The analyzer passed while the launcher icons
  # were missing from git. This job builds the example the way the package README says to:
  # the Android engine first, then a debug APK, then the web bundle.
  example:
    name: build the example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The Android engine build plus Gradle's outputs filled the runner's disk once (run
      # 41720676524). These directories ship with the image, and nothing in this job reads
      # them. The step runs before any SDK, cache or data lands, and warns when it found
      # less than 5 GB to free, because that means the image changed under this list.
      - name: Free disk space
        run: |
          df -h /
          before=$(df --output=avail -k / | tail -1)
          for dir in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -d "$dir" ]; then sudo rm -rf "$dir"; fi
          done
          after=$(df --output=avail -k / | tail -1)
          freed_gb=$(( (after - before) / 1024 / 1024 ))
          echo "freed ${freed_gb} GB"
          if [ "$freed_gb" -lt 5 ]; then
            echo "::warning::Free disk space freed only ${freed_gb} GB. The runner image's large directories moved."
          fi
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Registry only. This job builds the engine for three Android triples, the host and
      # wasm, and a restored target/ for all of them counts against the runner's disk as
      # much as a fresh build does. Under the release profile the rebuild is short.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # The NDK alone. The Flutter Gradle plugin fetches the platform and build tools its own
      # version pins, and the example has no CMake build.
      - uses: ./.github/actions/android-toolchain
        with:
          packages: ""
          cmake: "false"
          cargo-ndk: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Cache page data
        uses: actions/cache@v4
        with:
          path: dist/pages
          key: test-data-pages-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      # Only the page data. The SVG bundle serves the identity gate, which runs in ci.yml.
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SYNC: pages
        run: scripts/sync-test-data.sh
      - name: Example assets (the example's pubspec declares the pages directory)
        run: scripts/sync-example-data.sh flutter
      # The plugin's Android module ships src/main/jniLibs/<abi>/libqvp_ffi.so and builds
      # no native code of its own, so this job builds the engine before the APK. A debug
      # example APK does not need the shipping profile: `release` skips LTO, whose objects
      # for three triples are what filled the disk.
      - name: Build the engine for Android
        env:
          QVP_PROFILE: release
        run: scripts/build-engine-android.sh
      # The web engine assets are not tracked. The example bundles the plugin's asset
      # directories on every platform, so both builds below need them.
      - name: Build the web engine assets
        env:
          QVP_PROFILE: release
        run: scripts/sync-flutter-web-engine.sh
      - name: Build the example for Android
        working-directory: packages/flutter/qvp_flutter/example
        run: flutter pub get && flutter build apk --debug
      - name: Build the example for web
        working-directory: packages/flutter/qvp_flutter/example
        run: flutter build web
