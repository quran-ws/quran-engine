# The Flutter package: analyze, run the tests on the dart:ffi backend (Linux and macOS) and
# on the web backend (Chrome), and build the example for Android, web, macOS, the iOS
# simulator and Windows.
name: Flutter

on:
  pull_request:
    paths:
      - ".github/workflows/flutter.yml"
      - ".github/actions/android-toolchain/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packages/flutter/**"
      - "web/qvp.js"
      - "scripts/sync-flutter-web-engine.sh"
      - "scripts/check-flutter-bindings.sh"
      - "scripts/build-engine-android.sh"
      - "scripts/build-engine-ios.sh"
      - "scripts/build-engine-windows.ps1"
      - "scripts/check-darwin-engine-symbols.sh"
      - "scripts/sync-example-data.sh"
      - "scripts/sync-test-data.sh"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Cache page data
        uses: actions/cache@v4
        with:
          path: dist/pages
          key: test-data-pages-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      # Only the page data. The SVG bundle serves the identity gate, which runs in ci.yml.
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SYNC: pages
        run: scripts/sync-test-data.sh
      - name: Build the host engine library
        run: cargo build -p qvp-ffi --release
      # The web engine assets are not tracked. `flutter test` and the example build bundle
      # the asset directories, so a web test or build would fail without this step.
      - name: Build the web engine assets
        run: scripts/sync-flutter-web-engine.sh
      - name: Example assets (the analyzer checks the asset directory exists)
        run: scripts/sync-example-data.sh flutter
      # pub get runs once, before Format and Analyze. `flutter pub get` also resolves the example.
      - name: Get packages
        working-directory: packages/flutter/qvp_flutter
        run: flutter pub get
      # lib/src/bindings.dart is generated from crates/qvp-ffi/include/qvp.h. ffigen loads
      # libclang; the step installs it when the runner image has none.
      - name: Bindings match the header
        run: |
          ls /usr/lib/llvm-*/lib/libclang.so >/dev/null 2>&1 ||
            (sudo apt-get update && sudo apt-get install -y libclang-dev)
          scripts/check-flutter-bindings.sh
      # dart format is the house style for this package. It runs before the analyzer so a
      # formatting failure is not buried under analyzer output. The Dart that checks here is
      # the one the pinned Flutter brings, so a Flutter upgrade may ask for a reformat commit.
      # The style depends on the language version. After a pub get the formatter reads the
      # package's floor (3.6), which gives the older style and rewrites 11 files. The sources
      # use the newest style, so the flag names it. A contributor runs the same command.
      - name: Format
        working-directory: packages/flutter/qvp_flutter
        run: dart format --language-version=latest --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        working-directory: packages/flutter/qvp_flutter
        run: flutter analyze
      # The example is a package of its own, so the analyzer only resolves its imports
      # after its own pub get. Without this step nothing checks the example's API use.
      - name: Analyze the example
        working-directory: packages/flutter/qvp_flutter/example
        run: flutter pub get && flutter analyze
      - name: Test
        working-directory: packages/flutter/qvp_flutter
        env:
          QVP_LIB: ${{ github.workspace }}/target/release/libqvp_ffi.so
        run: flutter test
      # The example's UI smoke test: open a bundled page, tap a word, check the highlight.
      # It runs on the host with the same engine build and the assets synced above.
      - name: Test the example
        working-directory: packages/flutter/qvp_flutter/example
        env:
          QVP_LIB: ${{ github.workspace }}/target/release/libqvp_ffi.so
        run: flutter test
      # The shared cases (test/shared/api_cases.dart) again, on the web backend: qvp.js and
      # the wasm the "Build the web engine assets" step wrote. The runner image has Chrome.
      # The step names the file, because a Chrome run compiles every file it loads, and the
      # dart:ffi suite does not compile for the web.
      - name: Test the web backend in Chrome
        working-directory: packages/flutter/qvp_flutter
        run: flutter test --platform chrome test/qvp_web_test.dart

  # The example is the only app that reads the plugin's manifests, icon catalogs and asset
  # declarations, and only a build reads them. The analyzer passed while the launcher icons
  # were missing from git. This job builds the example the way the package README says to:
  # the Android engine first, then a debug APK, then the web bundle.
  example:
    name: build the example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The Android engine build plus Gradle's outputs filled the runner's disk once (run
      # 41720676524). These directories ship with the image, and nothing in this job reads
      # them. The step runs before any SDK, cache or data lands, and warns when it found
      # less than 5 GB to free, because that means the image changed under this list.
      - name: Free disk space
        run: |
          df -h /
          before=$(df --output=avail -k / | tail -1)
          for dir in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -d "$dir" ]; then sudo rm -rf "$dir"; fi
          done
          after=$(df --output=avail -k / | tail -1)
          freed_gb=$(( (after - before) / 1024 / 1024 ))
          echo "freed ${freed_gb} GB"
          if [ "$freed_gb" -lt 5 ]; then
            echo "::warning::Free disk space freed only ${freed_gb} GB. The runner image's large directories moved."
          fi
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Registry only. This job builds the engine for three Android triples, the host and
      # wasm, and a restored target/ for all of them counts against the runner's disk as
      # much as a fresh build does. Under the release profile the rebuild is short.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      # The NDK alone. The Flutter Gradle plugin fetches the platform and build tools its own
      # version pins, and the example has no CMake build.
      - uses: ./.github/actions/android-toolchain
        with:
          packages: ""
          cmake: "false"
          cargo-ndk: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Cache page data
        uses: actions/cache@v4
        with:
          path: dist/pages
          key: test-data-pages-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      # Only the page data. The SVG bundle serves the identity gate, which runs in ci.yml.
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SYNC: pages
        run: scripts/sync-test-data.sh
      - name: Example assets (the example's pubspec declares the pages directory)
        run: scripts/sync-example-data.sh flutter
      # The plugin's Android module ships src/main/jniLibs/<abi>/libqvp_ffi.so and builds
      # no native code of its own, so this job builds the engine before the APK. A debug
      # example APK does not need the shipping profile: `release` skips LTO, whose objects
      # for three triples are what filled the disk.
      - name: Build the engine for Android
        env:
          QVP_PROFILE: release
        run: scripts/build-engine-android.sh
      # The web engine assets are not tracked. The example bundles the plugin's asset
      # directories on every platform, so both builds below need them.
      - name: Build the web engine assets
        env:
          QVP_PROFILE: release
        run: scripts/sync-flutter-web-engine.sh
      - name: Build the example for Android
        working-directory: packages/flutter/qvp_flutter/example
        run: flutter pub get && flutter build apk --debug
      - name: Build the example for web
        working-directory: packages/flutter/qvp_flutter/example
        run: flutter build web

  # The two Apple platforms. Nothing else builds the podspecs, the Swift packages or the
  # dylib branch of the test harness. The job runs the dart:ffi suite on the macOS host
  # library, then builds the example for macOS and for the iOS simulator twice: once with
  # Swift Package Manager and once with CocoaPods. The plugin ships both, and each one
  # links QvpEngine.xcframework its own way. After each build a check finds the engine's
  # symbols in the app, because a build can pass while the linker drops them.
  darwin:
    name: macOS tests, macOS and iOS example builds
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The same targets as ios.yml: scripts/build-engine-ios.sh builds all five.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Cache page data
        uses: actions/cache@v4
        with:
          path: dist/pages
          key: test-data-pages-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SYNC: pages
        run: scripts/sync-test-data.sh
      - name: Build the host engine library
        run: cargo build -p qvp-ffi --release
      # The native suite does not read the web engine assets, so this job does not build
      # them. The example builds bundle the asset directories, which git keeps with a README.
      - name: Get packages
        working-directory: packages/flutter/qvp_flutter
        run: flutter pub get
      - name: Test
        working-directory: packages/flutter/qvp_flutter
        env:
          QVP_LIB: ${{ github.workspace }}/target/release/libqvp_ffi.dylib
        run: flutter test
      # Copies the framework into ios/qvp_flutter and macos/qvp_flutter, where the podspecs
      # and the Swift packages read it.
      - name: Build QvpEngine.xcframework
        run: scripts/build-engine-ios.sh
      - name: Example assets (the example's pubspec declares the pages directory)
        run: scripts/sync-example-data.sh flutter
      # macOS builds in release, where the linker strips most. The simulator build is debug,
      # the only mode Flutter builds for the simulator.
      - name: Build the example with Swift Package Manager
        working-directory: packages/flutter/qvp_flutter/example
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter build macos
          ../../../../scripts/check-darwin-engine-symbols.sh build/macos/Build/Products/Release/qvp_flutter_example.app
          flutter build ios --simulator --no-codesign
          ../../../../scripts/check-darwin-engine-symbols.sh build/ios/iphonesimulator/Runner.app
      # The Swift package builds wrote references to the plugin's Package.swift into the
      # example's Xcode projects. With them, Xcode resolves the plugin package outside
      # Flutter's ephemeral directory, finds no FlutterFramework next to it and stops. So the
      # step restores the example's tracked files, and flutter clean removes the Swift package
      # build. These builds then link through the pods.
      - name: Build the example with CocoaPods
        working-directory: packages/flutter/qvp_flutter/example
        run: |
          git checkout -- .
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get
          flutter build macos
          ../../../../scripts/check-darwin-engine-symbols.sh build/macos/Build/Products/Release/qvp_flutter_example.app
          flutter build ios --simulator --no-codesign
          ../../../../scripts/check-darwin-engine-symbols.sh build/ios/iphonesimulator/Runner.app

  # windows/CMakeLists.txt finds qvp_ffi.dll and hands it to the app bundle. Only a Windows
  # build runs it. The job stages the DLL the way the package README says to, builds the
  # example and checks that the DLL sits next to the executable.
  windows:
    name: Windows example build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      # The dist profile, into packages/flutter/qvp_flutter/windows/qvp_ffi.dll, the first
      # place CMake looks.
      - name: Build the engine library
        run: ./scripts/build-engine-windows.ps1
      # No page data: the example's pages directory and the plugin's asset directories are
      # in git with a README each, and the build only bundles them.
      - name: Build the example
        working-directory: packages/flutter/qvp_flutter/example
        run: |
          flutter pub get
          flutter build windows
      - name: The DLL is bundled
        working-directory: packages/flutter/qvp_flutter/example
        shell: bash
        run: |
          dll=build/windows/x64/runner/Release/qvp_ffi.dll
          test -s "$dll" || { echo "::error::$dll is missing; the plugin did not bundle the engine"; exit 1; }
          ls -l "$dll"
