# The Swift package and the iOS example: check QvpKit's doc blocks with swiftlint on Linux,
# build the engine XCFramework, run the Swift tests on the macOS slice, generate and build the
# example for the simulator.
name: iOS

on:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "packages/ios/**"
      - ".github/workflows/prepare-ios-release.yml"
      - "scripts/build-engine-ios.sh"
      - "scripts/package-ios.sh"
      - "scripts/set-xcframework.sh"
      - "scripts/sync-test-data.sh"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # missing_docs parses the sources with SwiftSyntax and needs no Xcode, so the Linux build of a
  # pinned release runs it. A newer swiftlint can count differently from the baseline, so the
  # version and the checksum change together, with the baseline written again.
  doc-blocks:
    name: QvpKit doc blocks (swiftlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
    steps:
      - uses: actions/checkout@v7
      - name: Install swiftlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint-static -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      # .swiftlint.yml turns on missing_docs alone, reads swiftlint-baseline.json, and makes a
      # finding an error.
      - name: missing_docs
        working-directory: packages/ios/QvpKit
        run: swiftlint-static lint --quiet

  swift:
    name: QvpKit tests and example build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Cache page data
        uses: actions/cache@v4
        with:
          path: dist/pages
          key: test-data-pages-${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}-${{ hashFiles('scripts/sync-test-data.sh') }}
      # Only the page data. The SVG bundle serves the identity gate, which runs in ci.yml.
      - name: Fetch page data
        env:
          QVP_DATA_TAG: ${{ vars.QVP_DATA_TAG || 'data-v0.5.0' }}
          QVP_SYNC: pages
        run: scripts/sync-test-data.sh
      - name: Build QvpEngine.xcframework
        run: scripts/build-engine-ios.sh
      - name: Swift tests (macOS slice)
        working-directory: packages/ios/QvpKit
        run: swift test
      # The packaging and manifest steps of prepare-ios-release.yml, on a copy of the
      # manifest. Nothing is uploaded or pushed.
      - name: Package, and set a copy of Package.swift
        run: |
          scripts/package-ios.sh
          cp Package.swift "$RUNNER_TEMP/Package.swift"
          scripts/set-xcframework.sh v0.0.0 "$(cat dist/ios/QvpEngine.xcframework.zip.checksum)" \
            "$GITHUB_SHA" "$RUNNER_TEMP/Package.swift"
          diff Package.swift "$RUNNER_TEMP/Package.swift" || true
      # `xcodebuild test` builds the Demo app and DemoUITests, then runs the six UI smoke
      # tests (open a page, tap a word, highlight, pinch, swipe) on a simulator. A test needs
      # a named device, where a build takes the generic destination, so the step picks the
      # first iPhone of the newest iOS runtime on the runner image. The list comes as JSON, so
      # the pick does not depend on how `simctl` prints its text. The destination also names
      # `OS=latest`, so xcodebuild runs that device on the same runtime.
      - name: Generate the example, build it, and run its UI smoke test on the simulator
        working-directory: packages/ios/example
        run: |
          # Without pipefail the step takes tail's exit status, so a failed build reads as a pass.
          set -o pipefail
          brew install xcodegen >/dev/null
          ./sync-pages.sh            # example/pages from the cached dist/pages; xcodegen needs the directory
          xcodegen generate
          device=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime.iOS-"))
             | {runtime: .key, name: ([.value[] | select(.name | startswith("iPhone")) | .name] | first)}
             | select(.name != null)]
            | sort_by(.runtime | capture("iOS-(?<v>.*)").v | split("-") | map(tonumber))
            | last | .name')
          [ -n "$device" ] && [ "$device" != null ] || { echo "::error::no iPhone simulator on this runner image"; exit 1; }
          echo "simulator: $device"
          xcodebuild -scheme Demo -destination "platform=iOS Simulator,name=$device,OS=latest" \
            -derivedDataPath ../../../target/ios-build \
            -resultBundlePath ../../../target/ios-build/Demo.xcresult \
            CODE_SIGNING_ALLOWED=NO test | tail -40
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-ui-test-${{ github.sha }}
          path: target/ios-build/Demo.xcresult
