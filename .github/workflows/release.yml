# A code release: tag vX.Y.Z. Runs the full check, builds every artifact, attaches the
# XCFramework and the wasm engine to the GitHub release, and publishes to each registry
# whose token is configured. A registry without a token is reported and skipped.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: tag matches Cargo.toml, full check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $have"; exit 1; }
          echo "version=$have" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch test data
        run: scripts/sync-test-data.sh
      - run: scripts/check.sh
      - name: Upload the wasm engine
        uses: actions/upload-artifact@v7
        with:
          name: qvp_ffi.wasm
          path: web/qvp_ffi.wasm

  xcframework:
    name: QvpEngine.xcframework
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-engine-ios.sh
      - name: Zip and checksum
        run: |
          cd packages/ios/QvpKit
          zip -qr ../../../QvpEngine.xcframework.zip QvpEngine.xcframework
          cd ../../..
          swift package compute-checksum QvpEngine.xcframework.zip > QvpEngine.xcframework.zip.checksum
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: |
            QvpEngine.xcframework.zip
            QvpEngine.xcframework.zip.checksum

  publish:
    name: GitHub release and registries
    needs: [verify, xcframework]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Release notes from the changelog
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - name: GitHub release with the engine artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            artifacts/qvp_ffi.wasm/qvp_ffi.wasm artifacts/xcframework/QvpEngine.xcframework.zip \
            artifacts/xcframework/QvpEngine.xcframework.zip.checksum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "::notice::crates.io skipped: CARGO_REGISTRY_TOKEN is not set"; exit 0; fi
          for c in qvp-format qvp-core qvp-convert qvp-ffi; do cargo publish -p "$c" --no-verify; sleep 30; done
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::npm skipped: NPM_TOKEN is not set"; exit 0; fi
          cp artifacts/qvp_ffi.wasm/qvp_ffi.wasm web/qvp_ffi.wasm
          npm publish --access public --ignore-scripts
          (cd packages/react-native/qvp-react-native && npm install --no-audit --no-fund && npm run build && npm publish --access public)
      - name: pub.dev and Maven Central
        run: echo "::notice::pub.dev and Maven Central publishing are not wired yet (see docs/standards/RELEASING.md); the packages are consumable from this release's tag"
