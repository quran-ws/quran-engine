# A code release: prepare the iOS artifact, then tag engine-vX.Y.Z. The page data releases of
# this repository are tagged vX.Y.Z, the version the CDN serves them under, so the engine line
# carries the prefix that keeps the two apart. Runs the full check, verifies the
# prepared XCFramework, builds the Android AAR and wasm engine, completes the GitHub release,
# and publishes to each configured registry. A registry without a token is reported and skipped.
name: Release

on:
  push:
    tags: ["engine-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: tag matches Cargo.toml, full check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          want="${GITHUB_REF_NAME#engine-v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $have"; exit 1; }
          echo "version=$have" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch test data
        run: scripts/sync-test-data.sh
      - run: scripts/check.sh
      - name: Upload the wasm engine
        uses: actions/upload-artifact@v7
        with:
          name: qvp_ffi.wasm
          path: web/qvp_ffi.wasm

  xcframework:
    name: prepared QvpEngine.xcframework
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify the prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)"
          [ -n "$release_id" ] || {
            echo "error: no prepared release for $GITHUB_REF_NAME; run scripts/prepare-ios-release.sh first" >&2
            exit 1
          }
          for name in QvpEngine.xcframework.zip QvpEngine.xcframework.zip.checksum; do
            asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$name\") | .id")"
            [ -n "$asset_id" ] || { echo "error: prepared release lacks $name" >&2; exit 1; }
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$name"
          done
          expected="$(sed -n 's/.*checksum: "\([0-9a-f]\{64\}\)".*/\1/p' Package.swift)"
          recorded="$(cat QvpEngine.xcframework.zip.checksum)"
          actual="$(sha256sum QvpEngine.xcframework.zip | cut -d' ' -f1)"
          [ "$expected" = "$recorded" ] && [ "$recorded" = "$actual" ] || {
            echo "error: Package.swift, checksum asset, and XCFramework differ" >&2
            exit 1
          }
          grep -Fq "releases/download/$GITHUB_REF_NAME/QvpEngine.xcframework.zip" Package.swift || {
            echo "error: Package.swift does not point at $GITHUB_REF_NAME" >&2
            exit 1
          }
          unzip -tq QvpEngine.xcframework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: |
            QvpEngine.xcframework.zip
            QvpEngine.xcframework.zip.checksum

  android:
    name: qvp-android AAR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `packages` defaults to "tools platform-tools". Google removed the deprecated
      # `tools` package from the SDK repository, so the default install now fails with
      # "Failed to find package 'tools'". The next step installs what the build needs.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "ndk;$NDK_VERSION" "cmake;3.22.1"
      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Package and verify AAR
        run: scripts/package-android.sh "${{ needs.verify.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/android/*.aar
            dist/android/*.sha256
      - name: Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || \
             [ -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] || \
             [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || \
             [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]; then
            echo "::notice::Maven Central skipped: publishing or signing credentials are not set"
            exit 0
          fi
          cd packages/android
          ./gradlew --no-daemon :qvp:publishAndReleaseToMavenCentral \
            -PqvpVersion="${{ needs.verify.outputs.version }}" \
            -PsignAllPublications=true

  publish:
    name: GitHub release and registries
    needs: [verify, xcframework, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Release notes from the changelog
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - name: Complete the prepared GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)"
          [ -n "$release_id" ] || { echo "error: prepared release is missing" >&2; exit 1; }
          upload_asset() {
            path="$1"
            name="$(basename "$path")"
            old="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$name\") | .id")"
            [ -z "$old" ] || gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              --input "$path" >/dev/null
          }
          upload_asset artifacts/qvp_ffi.wasm/qvp_ffi.wasm
          upload_asset artifacts/android/qvp-android-${{ needs.verify.outputs.version }}.aar
          upload_asset artifacts/android/qvp-android-${{ needs.verify.outputs.version }}.aar.sha256
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name="$GITHUB_REF_NAME" -f target_commitish="$GITHUB_SHA" \
            -f name="$GITHUB_REF_NAME" -f body="$(cat notes.md)" \
            -F draft=false -F prerelease=false -f make_latest=true >/dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "::notice::crates.io skipped: CARGO_REGISTRY_TOKEN is not set"; exit 0; fi
          for c in qvp-format qvp-core qvp-convert qvp-ffi; do cargo publish -p "$c" --no-verify; sleep 30; done
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::npm skipped: NPM_TOKEN is not set"; exit 0; fi
          cp artifacts/qvp_ffi.wasm/qvp_ffi.wasm web/qvp_ffi.wasm
          npm publish --access public --ignore-scripts
          (cd packages/react-native/qvp-react-native && npm install --no-audit --no-fund && npm run build && npm publish --access public)
      - name: pub.dev
        run: echo "::notice::pub.dev publishing is not wired yet (see docs/standards/RELEASING.md); the package is consumable from this release's tag"

  cdn:
    name: engine builds to cdn.quran.ws
    needs: [verify, publish]
    runs-on: ubuntu-latest
    # The R2 credentials live in this environment, not in repo secrets, so only a run
    # started from a tag — and approved — can reach them.
    environment: cdn
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Each build is its own family on the CDN, so a consumer that wants the wasm never
      # lists the Apple artifacts, and the three can move at different versions later.
      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'cdn-quran-ws' }}
          VERSION: v${{ needs.verify.outputs.version }}
          AAR_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          . scripts/cdn-put.sh
          cdn_init
          publish() {   # publish <family> <file>...
            local family="$1"; shift
            local prefix="engine/$family/$VERSION" tmp
            cdn_guard "$prefix" || exit 1
            tmp=$(mktemp -d)
            for f in "$@"; do
              printf '%s\t%s\t%s\n' "$(basename "$f")" "$(wc -c < "$f" | tr -d ' ')" "$(sha256 "$f")"
            done > "$tmp/files.tsv"
            jq -n --arg version "$VERSION" --arg base "https://$CDN_HOST/$prefix/" \
                  --rawfile tsv "$tmp/files.tsv" \
              '{version: $version, base: $base,
                files: ($tsv | rtrimstr("\n") | split("\n") | map(split("\t") |
                  {name: .[0], bytes: (.[1]|tonumber), sha256: .[2]}))}' > "$tmp/manifest.json"
            for f in "$@"; do cdn_put "$prefix/$(basename "$f")" "$f"; done
            cdn_put "$prefix/manifest.json" "$tmp/manifest.json" "public, max-age=300"
            cdn_latest "engine/$family" "$VERSION"
            echo "== published https://$CDN_HOST/$prefix/manifest.json"
          }
          publish wasm artifacts/qvp_ffi.wasm/qvp_ffi.wasm
          publish apple artifacts/xcframework/QvpEngine.xcframework.zip \
                        artifacts/xcframework/QvpEngine.xcframework.zip.checksum
          publish android "artifacts/android/qvp-android-$AAR_VERSION.aar" \
                          "artifacts/android/qvp-android-$AAR_VERSION.aar.sha256"

      - name: Check it is live
        env:
          VERSION: v${{ needs.verify.outputs.version }}
        run: |
          for family in wasm apple android; do
            base="https://cdn.quran.ws/engine/$family/$VERSION"
            curl -fsS "$base/manifest.json" -o /tmp/m.json
            name=$(jq -r '.files[0].name' /tmp/m.json)
            want=$(jq -r '.files[0].sha256' /tmp/m.json)
            curl -fsS -H 'Origin: https://example.com' -o /tmp/a -D /tmp/h "$base/$name"
            grep -qi '^access-control-allow-origin' /tmp/h || { echo "no CORS header on $family"; exit 1; }
            got=$(sha256sum /tmp/a | cut -d' ' -f1)
            [ "$want" = "$got" ] || { echo "$family/$name digest mismatch"; exit 1; }
            echo "$family ok"
          done
