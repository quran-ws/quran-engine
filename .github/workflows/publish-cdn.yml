# Publish a QVP data release to its edition family on cdn.quran.ws. Versions are immutable:
# this runs once per release and refuses to overwrite a folder that already exists.
name: publish-cdn

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Data release tag (data-vX.Y.Z or data-hafs-qcf-v1-1405h-vX.Y.Z)'
        required: true

jobs:
  publish:
    # Data tags choose an edition family. Code releases (vX.Y.Z) carry the engine, not pages;
    # v0.1.0 is the one historical data-tag exception.
    if: ${{ inputs.version != '' || startsWith(github.event.release.tag_name, 'data-v') || startsWith(github.event.release.tag_name, 'data-hafs-qcf-v1-1405h-v') || github.event.release.tag_name == 'v0.1.0' }}
    runs-on: ubuntu-latest
    # The R2 credentials live in this environment, not in repo secrets, so only a run
    # started from a tag — and approved — can reach them.
    environment: cdn
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The bundle is built with brotli -q 11; the runner image does not guarantee it.
      - name: Install brotli
        run: command -v brotli || sudo apt-get install -y -qq brotli

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'cdn-quran-ws' }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: ./scripts/publish-cdn.sh "$VERSION" --from-release

      - name: Check it is live
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          profile=$(python scripts/qvp-data-release.py profile "$VERSION")
          v=$(jq -r .version <<< "$profile")
          family=$(jq -r .family <<< "$profile")
          legacy=$(jq -r .legacy_redirect <<< "$profile")
          base="https://cdn.quran.ws/$family/$v"
          curl -fsS "$base/manifest.json" -o /tmp/m.json

          # A page: CORS must be present, and the bytes must match the manifest digest.
          # The Origin header is required — R2 only emits CORS in response to one.
          curl -fsS --compressed -H 'Origin: https://example.com' -o /tmp/001.qvp -D /tmp/h "$base/001.qvp"
          grep -qi '^access-control-allow-origin' /tmp/h || { echo "no CORS header"; exit 1; }
          want=$(jq -r '.files[]|select(.name=="001.qvp")|.sha256' /tmp/m.json)
          got=$(sha256sum /tmp/001.qvp | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "001.qvp digest mismatch"; exit 1; }

          # The bundle is already brotli. The edge must return its stored bytes unchanged.
          name=$(jq -r .bundle.name /tmp/m.json)
          curl -fsS -o /tmp/bundle -D /tmp/bh -H 'Accept-Encoding: gzip, deflate, br, zstd' "$base/$name"
          enc=$(tr -d '\r' < /tmp/bh | awk 'tolower($1)=="content-encoding:"{print tolower($2)}')
          [ -z "$enc" ] || { echo "bundle served with Content-Encoding '$enc'"; exit 1; }
          want=$(jq -r .bundle.sha256 /tmp/m.json)
          got=$(sha256sum /tmp/bundle | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "bundle digest mismatch: want $want got $got"; exit 1; }

          got=$(curl -fsS "https://cdn.quran.ws/$family/latest.json" | jq -r .version)
          [ "$got" = "$v" ] || { echo "latest.json names '$got', expected '$v'"; exit 1; }

          # Only the original V4 family has the historical qvp.quran.ws redirect.
          if [ "$legacy" = true ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I "https://qvp.quran.ws/$v/manifest.json")
            [ "$code" = 301 ] || echo "::warning::qvp.quran.ws returned $code, expected 301"
          fi

          echo "$family pages, digests, bundle encoding and latest all ok"
